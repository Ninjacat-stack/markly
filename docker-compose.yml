services:
  web:
    build: .
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  api:
    build:
      context: ./apps/api
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env
    environment:
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./services/ai-service
    ports:
      - "8001:8001"
    env_file:
      - ./services/ai-service/.env
