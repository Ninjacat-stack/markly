# Production stack: API + AI service only (frontend is deployed to Vercel).
# Reverse proxy (Caddy/nginx) on the host terminates HTTPS -> 127.0.0.1:4000.
#
# Assumes the repo is cloned at /opt/assignmentai (the duplicate /data bind is
# intentional: the API's {dir} placeholder must be a path that the HOST dockerd
# also sees, so the same directory is mounted at the container path AND at its
# host path for `docker run -v "{dir}:/work"` PDF compilation).

services:
  api:
    build:
      context: ./apps/api
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - ./apps/api/.env
    environment:
      AI_SERVICE_URL: http://ai-service:8001
      TMPDIR: /opt/assignmentai/data/tex
    volumes:
      - ./data:/app/data
      - ./data:/opt/assignmentai/data
      - ./apps/api/assets:/app/assets
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ai-service
    restart: unless-stopped

  ai-service:
    build:
      context: ./services/ai-service
    env_file:
      - ./services/ai-service/.env
    volumes:
      - ./services/ai-service/corpus:/app/corpus
    restart: unless-stopped
